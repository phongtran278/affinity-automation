name: T7 Static Regression

on:
  push:
    branches:
      - refactor/modular-core
      - feature/t7-v2
  pull_request:
    paths:
      - "core/**"
      - "profiles/**"
      - "rules/**"
      - "data/**"
      - "batch-edit-prohomes-t7.mjs"
      - "tests/**"
      - "package.json"
      - ".github/workflows/t7-static-regression.yml"

jobs:
  t7-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static T7 regression (no Affinity connection required)
        run: npm test
